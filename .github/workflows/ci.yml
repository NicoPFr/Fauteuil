name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools
        run: brew install ffmpeg yt-dlp
      - name: Test
        run: make test
      - name: Build universal app
        run: make universal
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/Fauteuil.app build/Fauteuil-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fauteuil-macOS-universal
          path: build/Fauteuil-macOS-universal.zip
          retention-days: 7
