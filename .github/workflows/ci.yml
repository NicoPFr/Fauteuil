name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check the download worker on Python 3.9
        run: PYTHONPATH=app python3 -B -m unittest discover -s tests/python -p test_download_worker.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the first-run runtime installer
        run: |
          runtime="$RUNNER_TEMP/fauteuil-runtime"
          env -i HOME="$HOME" PATH=/usr/bin:/bin /bin/bash scripts/install-runtime.sh "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
      - name: Test
        run: make test
      - name: Build universal app
        run: make universal
      - name: Test installation and replacement
        run: make test-install
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/Fauteuil.app build/Fauteuil-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fauteuil-macOS-universal
          path: build/Fauteuil-macOS-universal.zip
          retention-days: 7
