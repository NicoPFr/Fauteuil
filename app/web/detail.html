<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiche vidéo</title><link rel="stylesheet" href="/styles/detail.css">
</head><body><header class="top" onclick="home()">FAUTEUIL</header><main><div class="cover-frame"><img class="cover" id="cover" alt=""></div><h1 id="title">Chargement…</h1><div id="meta" class="muted"></div><div class="buttons"><button id="watch" onclick="launch()" disabled>▶ Lire</button><button id="youtubeBtn" class="secondary" type="button" hidden>Ouvrir sur YouTube</button><button id="keepBtn" class="secondary" type="button" onclick="keepOffline()" hidden>Garder hors ligne</button><button id="removeDownloadBtn" class="secondary" type="button" onclick="document.querySelector('#removeDialog').showModal()" hidden>Retirer le téléchargement</button><button id="saveBtn" class="secondary" type="button">＋ Ma liste</button><button class="secondary" onclick="home()">Retour au catalogue</button></div><p id="status" class="muted" role="status"></p><progress id="downloadProgress" aria-label="Progression du téléchargement" max="100" hidden></progress><h3>Synopsis</h3><div id="desc" class="muted"></div></main>
<dialog id="removeDialog" aria-labelledby="removeTitle">
  <h2 id="removeTitle">Retirer le téléchargement</h2>
  <p>La copie hors ligne sera placée dans la Corbeille du Mac. La vidéo restera dans ton catalogue.</p>
  <form method="dialog" class="buttons">
    <button class="secondary" value="cancel" autofocus>Annuler</button>
    <button value="remove">Placer dans la Corbeille</button>
  </form>
</dialog>
<script src="/scripts/detail.js"></script>
</body></html>
